<!DOCTYPE html>
<html lang="en" data-theme="light" data-fontsize="md">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Pocket Hours — a quiet, personal time-tracking and study companion. Your life has its own pace." />
  <meta name="theme-color" content="#f4ede4" />
  <title>Pocket Hours — Your life has its own pace.</title>

  <!-- Fonts: refined serif (Newsreader), reading serif (Literata), UI sans (Manrope) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&family=Manrope:wght@400..700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-root">
    <!-- Loading splash, replaced on boot -->
    <div class="loading-splash">
      <div class="loading-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="36" height="36"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </div>
      <div class="loading-name">Pocket Hours</div>
      <div class="loading-tag">Your life has its own pace.</div>
    </div>
  </div>

  <script type="module">
    // Boot the application
    import('./js/app.js').then(m => m.boot()).catch(err => {
      console.error('Failed to boot Pocket Hours', err);
      const root = document.getElementById('app-root');
      if (root) root.innerHTML = '<div style="padding:2rem;font-family:sans-serif;color:#2e2b27">Could not start Pocket Hours. Please serve this folder over HTTP (e.g. <code>python -m http.server</code>) rather than opening the file directly, so ES modules can load.</div>';
    });
  </script>
</body>
</html>
